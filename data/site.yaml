        name: "Joined Contextual Code"
        type: "event"
    

    -
        year: 2014
        name: "Modern Language Association"
        images_path: "i/s/mla"
        desc: |
            This was my first major project at Contextual Code. I collaborated closely with both my
            colleagues at Contextual Code and directly with the Modern Language Association (MLA) to build and maintain their website.

            The site was powered by the Ibexa CMS (formerly eZPublish) and featured a sophisticated member
            signup flow, plus a full-fledged bookstore that blended Shopify integrations with custom e-commerce
            solutions. Additionally, we worked with the MLA's own developers who built a custom API that allowed
            us to fetch and display data from the MLA's internal database.

            https://www.mla.org

