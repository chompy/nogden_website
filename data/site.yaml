events:
    -
        year: 2007
        name: "Tallahassee Film Society Website"
        type: "project"
        images_path: "i/s/tfs"
        desc: |
            I launched my software development career by volunteering with the Tallahassee Film Society, 
            helping them rebuild and host their website. Now, 20 years later, I'm still proudly maintaining it.

            The site has evolved several times over the years: it began as a custom PHP build, later migrated to WordPress,
            and now runs on Django. Through each iteration, the core requirement has remained the same: a simple
            backend where staff can easily add new showings. The site also features a Shopify integration
            for seamless ticket sales.

            https://www.tallahasseefilms.com

